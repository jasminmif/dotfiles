# What dotsync keeps in sync across your Macs.
#
#   defaults <domain> <key>                 macOS preference (-g = global domain)
#   defaults-host <domain> <key>            per-machine (-currentHost) preference
#   json <app-name> <file under ~> <key.path>   one setting inside an app's JSON file
#   mackup <app>                            app config files copied by Mackup (`mackup list`)
#
# Don't know a setting's key? Run `dotsync track`, change the setting, press
# Enter, and it will show what changed and offer to add it here.

# --- Mouse, trackpad & keyboard ---
defaults -g com.apple.mouse.scaling
defaults -g com.apple.trackpad.scaling
defaults -g com.apple.scrollwheel.scaling
defaults -g com.apple.swipescrolldirection
defaults -g KeyRepeat
defaults -g InitialKeyRepeat
defaults -g ApplePressAndHoldEnabled
defaults com.apple.AppleMultitouchTrackpad Clicking
defaults com.apple.AppleMultitouchTrackpad TrackpadThreeFingerDrag
defaults com.apple.driver.AppleBluetoothMultitouch.trackpad Clicking
defaults com.apple.driver.AppleBluetoothMultitouch.trackpad TrackpadThreeFingerDrag

# --- General ---
defaults -g AppleInterfaceStyle
defaults -g AppleShowAllExtensions

# --- Dock ---
defaults com.apple.dock orientation
defaults com.apple.dock autohide
defaults com.apple.dock tilesize
defaults com.apple.dock show-recents
defaults com.apple.dock mru-spaces
# Hot corners are toggled by start_dota/exit_dota, so they're not synced by default.
# defaults com.apple.dock wvous-bl-corner
# defaults com.apple.dock wvous-br-corner

# --- Finder ---
defaults com.apple.finder AppleShowAllFiles
defaults com.apple.finder FXPreferredViewStyle
defaults com.apple.finder ShowPathbar
defaults com.apple.finder ShowStatusBar

# --- Apps (single settings) ---
# Only pick specific keys: these files also hold account data and login tokens.
json Claude "Library/Application Support/Claude/claude_desktop_config.json" preferences.quickEntryShortcut

# --- Apps (whole config files, via Mackup) ---
mackup iterm2
mackup rectangle
mackup vscode
mackup cursor
mackup claude-code
# Left out on purpose: they often differ between work and personal Macs.
# mackup git
# mackup zsh
